name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build:prod

      - name: Verify output
        run: |
          echo "Checking compiled files..."
          ls -la services/*.js monitor/*.js utils/*.js config/*.js constants/*.js 2>/dev/null || true
          echo "Build complete."

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: miniprogram-build
          path: |
            app.js
            app.json
            app.wxss
            sitemap.json
            project.config.json
            pages/**/*
            package-*/**/*
            services/**/*.js
            monitor/**/*.js
            utils/**/*.js
            config/**/*.js
            constants/**/*.js
            untils/**/*
            images/**/*
            dist/**/*
          retention-days: 7

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: true
